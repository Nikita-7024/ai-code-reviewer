<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Code Reviewer</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg:#0d1117; --bg2:#161b22; --bg3:#21262d; --bg4:#2d333b;
        --border:#30363d; --border2:#444c56;
        --text:#e6edf3; --text2:#8b949e; --text3:#6e7681;
        --blue:#58a6ff; --blue-bg:#1f3a5c;
        --green:#3fb950; --green-bg:#1a3a28;
        --yellow:#d29922; --yellow-bg:#3a2e00;
        --red:#f85149; --red-bg:#3d1c1c;
        --purple:#bc8cff; --purple-bg:#2d1f5e;
        --radius:6px; --radius-lg:12px;
      }
      body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; font-size:14px; line-height:1.6; min-height:100vh; }
      a { color:var(--blue); text-decoration:none; }
      a:hover { text-decoration:underline; }
      button,input,select { cursor:pointer; font-family:inherit; font-size:14px; }
      ::-webkit-scrollbar { width:6px; height:6px; }
      ::-webkit-scrollbar-track { background:var(--bg); }
      ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
